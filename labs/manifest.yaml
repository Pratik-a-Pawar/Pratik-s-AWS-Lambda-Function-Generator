# Lab manifest. For each lab: where its material lives, which files the learner
# writes (`owned`; each has a skeleton under <dir>/skeleton/) and which pytest
# files `lfg labcheck` runs (`checks`).
labs:
  "00":
    title: Workstation and account guardrails
    dir: labs/00-workstation
    owned: [labs/00-workstation/answers.md]
    checks: [labs/checks/test_lab00.py]
  "01":
    title: Threat model the generator
    dir: labs/01-threat-model
    owned: [docs/threat-model.md]
    checks: [labs/checks/test_lab01.py]
  "02":
    title: Function spec and policy checker
    dir: labs/02-spec-and-policy
    owned:
      - schemas/function-spec.schema.json
      - tools/lfg/spec.py
      - tools/lfg/policy/__init__.py
      - tools/lfg/policy/acceptance.py
      - tools/lfg/policy/template_rules.py
      - tools/lfg/policy/iam_rules.py
      - tools/lfg/policy/config_rules.py
    checks:
      - tests/lfg/test_spec.py
      - tests/lfg/test_cli_validate_spec.py
      - tests/lfg/test_policy_engine.py
      - tests/lfg/test_policy_template.py
      - tests/lfg/test_policy_iam.py
      - tests/lfg/test_policy_config.py
      - tests/lfg/test_cli_policy_check.py
